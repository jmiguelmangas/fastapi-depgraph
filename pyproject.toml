[project]
name = "fastapi-depgraph"
version = "0.1.0"
description = "Introspection of a FastAPI app's Depends() tree: shared dependencies, uncached ones, and export to Mermaid/ASCII."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jmiguelmangas", email = "jmmangas@gmail.com" }]
keywords = [
    "fastapi",
    "dependency-injection",
    "depends",
    "introspection",
    "graph",
    "mermaid",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
]

[project.urls]
Homepage = "https://github.com/jmiguelmangas/fastapi-depgraph"
Repository = "https://github.com/jmiguelmangas/fastapi-depgraph"
Issues = "https://github.com/jmiguelmangas/fastapi-depgraph/issues"

[project.scripts]
depgraph = "fastapi_depgraph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_depgraph"]
