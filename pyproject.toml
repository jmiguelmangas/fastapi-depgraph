[project]
name = "fastapi-depgraph"
version = "0.1.0"
description = "Introspección del árbol de Depends() de una app FastAPI: dependencias compartidas, no cacheadas, y export a Mermaid/ASCII."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
]

[project.scripts]
depgraph = "fastapi_depgraph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_depgraph"]
